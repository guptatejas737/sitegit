<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fafaf8" />
    <title>SiteCommit — 3D site history</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip" href="#main">Skip to workspace</a>
    <div id="app">
      <p class="boot">Opening SiteCommit site history…</p>
    </div>
    <dialog id="modal"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input id="file-input" type="file" hidden /><noscript
      >JavaScript is required to edit and save this workspace.</noscript
    >
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
